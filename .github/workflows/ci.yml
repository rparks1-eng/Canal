name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run validate

  dependency-review:
    name: Dependency review
    if: >-
      github.event_name == 'pull_request' &&
      vars.DEPENDENCY_GRAPH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject newly vulnerable dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  dependency-review-unavailable:
    name: Dependency review unavailable
    if: >-
      github.event_name == 'pull_request' &&
      vars.DEPENDENCY_GRAPH_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Report repository security gate
        run: |
          echo "::warning::Dependency review did not run. Enable the repository dependency graph, then set the DEPENDENCY_GRAPH_ENABLED repository variable to true."
